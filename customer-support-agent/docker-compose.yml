services:
  db:
    image: pgvector/pgvector:pg16
    container_name: customer-support-db
    environment:
      POSTGRES_DB: customer_support_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
